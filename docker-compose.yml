services:
  # バックエンド (Laravel API)
  app:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tasknote_db
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - db
    # Laravel開発サーバーの起動
    command: php artisan serve --host=0.0.0.0 --port=8000

  # フロントエンド (React/Vite)
  web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    tty: true
    # Vite開発サーバーの起動
    command: npm run dev

  # データベース (PostgreSQL)
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tasknote_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
